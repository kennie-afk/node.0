# Production overlay. Use it ON TOP of docker-compose.yml, never with docker-compose.demo.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile backup up -d backup
#
# Needs Docker Compose 2.24 or newer (it uses !reset and !override to take things away from the base file).
#
# What it changes from the base file, which stays the local / demo path:
#   - billing is live: BILLING_MODE=live with a BILLING_SHORTCODE, and the mock-in-production escape hatch is shut
#   - Postgres publishes no port at all; only the containers on the compose network can reach it
#   - the API, ingestion and console listen on 127.0.0.1 only: put a TLS-terminating reverse proxy in front of them
#     (Safaricom must reach the API over HTTPS; devices reach ingestion over HTTPS; people reach the console)
#   - every long-running service restarts always, and nothing is built with a default secret
#   - CORS_ORIGINS must be set to the console's public address
#
# Required in .env (compose refuses to start without them): POSTGRES_PASSWORD, FORECOURT_APP_PASSWORD, JWT_SECRET,
# MPESA_CALLBACK_SECRET, BILLING_SHORTCODE, CORS_ORIGINS. Run `npm run admin -- billing:show` after the first start.

services:
  postgres:
    restart: always
    ports: !reset []

  api:
    restart: always
    ports: !override
      - "127.0.0.1:${API_PORT:-4000}:4000"
    environment:
      BILLING_MODE: live
      BILLING_ALLOW_MOCK_IN_PRODUCTION: "false"
      BILLING_SHORTCODE: ${BILLING_SHORTCODE:?BILLING_SHORTCODE must be set, live billing takes real M-Pesa on that shortcode}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set to the console's public address}
      MPESA_ALLOWED_IPS: ${MPESA_ALLOWED_IPS:-}

  ingestion:
    restart: always
    ports: !override
      - "127.0.0.1:${INGESTION_PORT:-4100}:4100"

  console:
    restart: always
    ports: !override
      - "127.0.0.1:${CONSOLE_PORT:-3300}:3300"

  backup:
    restart: always
