name: forecourt

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecourt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-forecourt}
    volumes:
      - forecourt-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forecourt}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["node", "dist/persistence/migrate.js"]
    environment:
      DATABASE_URL: postgres://forecourt_app:${FORECOURT_APP_PASSWORD:?FORECOURT_APP_PASSWORD must be set and at least 12 characters}@postgres:5432/${POSTGRES_DB:-forecourt}
      DATABASE_MIGRATION_URL: postgres://${POSTGRES_USER:-forecourt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forecourt}
      FORECOURT_APP_PASSWORD: ${FORECOURT_APP_PASSWORD:?FORECOURT_APP_PASSWORD must be set and at least 12 characters}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set and at least 32 characters}
      MPESA_CALLBACK_SECRET: ${MPESA_CALLBACK_SECRET:?MPESA_CALLBACK_SECRET must be set and at least 16 characters}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://forecourt_app:${FORECOURT_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-forecourt}
      DATABASE_MIGRATION_URL: postgres://${POSTGRES_USER:-forecourt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forecourt}
      FORECOURT_APP_PASSWORD: ${FORECOURT_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set and at least 32 characters}
      MPESA_CALLBACK_SECRET: ${MPESA_CALLBACK_SECRET:?MPESA_CALLBACK_SECRET must be set and at least 16 characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      API_PORT: 4000
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  ingestion:
    build: .
    restart: unless-stopped
    command: ["node", "dist/ingestion/server.js"]
    environment:
      DATABASE_URL: postgres://forecourt_app:${FORECOURT_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-forecourt}
      DATABASE_MIGRATION_URL: postgres://${POSTGRES_USER:-forecourt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forecourt}
      FORECOURT_APP_PASSWORD: ${FORECOURT_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set and at least 32 characters}
      MPESA_CALLBACK_SECRET: ${MPESA_CALLBACK_SECRET:?MPESA_CALLBACK_SECRET must be set and at least 16 characters}
      INGESTION_PORT: 4100
    ports:
      - "${INGESTION_PORT:-4100}:4100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  console:
    build:
      context: ./apps/console
    restart: unless-stopped
    environment:
      FORECOURT_API_URL: http://api:4000
    ports:
      - "${CONSOLE_PORT:-3300}:3300"
    depends_on:
      api:
        condition: service_healthy

volumes:
  forecourt-data:
