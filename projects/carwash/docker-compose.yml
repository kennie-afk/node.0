name: forecourt

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecourt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-forecourt}
    volumes:
      - forecourt-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forecourt}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-forecourt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forecourt}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set and at least 32 characters}
      MPESA_CALLBACK_SECRET: ${MPESA_CALLBACK_SECRET:-development-callback-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      API_PORT: 4000
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    build: .
    restart: unless-stopped
    command: ["node", "dist/ingestion/server.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-forecourt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forecourt}
      JWT_SECRET: ${JWT_SECRET}
      INGESTION_PORT: 4100
    ports:
      - "${INGESTION_PORT:-4100}:4100"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  forecourt-data:
