global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  # Docker DNS returns one A record per replica of a service, so scaling needs no config change.
  - job_name: cms-api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9100
        refresh_interval: 10s
  - job_name: cms-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 10s
