groups:
  - name: cms
    rules:
      - alert: CmsHighErrorRate
        expr: sum(rate(cms_http_request_duration_seconds_count{status="5xx"}[5m])) / sum(rate(cms_http_request_duration_seconds_count[5m])) > 0.02
        for: 5m
        labels: {severity: page}
        annotations: {summary: "More than 2% of requests are failing with 5xx"}
      - alert: CmsSlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(cms_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: {severity: warn}
        annotations: {summary: "p95 request latency above 1s"}
      - alert: CmsJobBacklog
        expr: cms_jobs_oldest_queued_age_seconds > 600
        for: 5m
        labels: {severity: warn}
        annotations: {summary: "The oldest queued job has waited over 10 minutes; workers are down or saturated"}
      - alert: CmsDeadJobs
        expr: max(cms_jobs_queue_depth{status="dead"}) > 0
        for: 15m
        labels: {severity: warn}
        annotations: {summary: "Jobs are in the dead-letter state and need attention"}
      - alert: CmsDbPoolExhausted
        expr: max by (instance) (cms_db_pool_connections{state="waiting"}) > 0
        for: 5m
        labels: {severity: warn}
        annotations: {summary: "Requests are waiting for a database connection"}
      - alert: CmsApiDown
        expr: up{job="cms-api"} == 0
        for: 2m
        labels: {severity: page}
        annotations: {summary: "An API replica is not being scraped"}
