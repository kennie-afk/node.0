# TEMPLATE ONLY - not listed in kustomization.yaml. Real values come from your secret manager
# (see overlays/production/external-secret.yaml) or, for kind, the overlay's secretGenerator.
#   JWT_SECRET            >= 32 random characters
#   POSTGRES_PASSWORD     owner role, used only by the migrate Job
#   APP_DB_PASSWORD       application role (non-owner), used by api, worker and PgBouncer
#   DATABASE_URL          postgres://cms_app:<APP_DB_PASSWORD>@cms-pgbouncer:5432/cms
#   MIGRATE_DATABASE_URL  postgres://cms:<POSTGRES_PASSWORD>@<postgres-rw>:5432/cms   (direct, not PgBouncer)
apiVersion: v1
kind: Secret
metadata:
  name: cms-secrets
type: Opaque
stringData:
  JWT_SECRET: "CHANGE-ME-generate-with-openssl-rand-hex-32"
  POSTGRES_PASSWORD: "CHANGE-ME"
  APP_DB_PASSWORD: "CHANGE-ME"
  DATABASE_URL: "postgres://cms_app:CHANGE-ME@cms-pgbouncer:5432/cms"
  MIGRATE_DATABASE_URL: "postgres://cms:CHANGE-ME@cms-postgres:5432/cms"
