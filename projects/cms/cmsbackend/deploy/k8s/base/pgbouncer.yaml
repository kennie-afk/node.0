apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-pgbouncer
  labels: {app.kubernetes.io/name: pgbouncer, app.kubernetes.io/part-of: church-cms}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: pgbouncer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: pgbouncer, app.kubernetes.io/part-of: church-cms}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.23.1-p2
          imagePullPolicy: IfNotPresent
          ports: [{name: pg, containerPort: 5432}]
          env:
            - {name: DB_HOST, value: cms-postgres}
            - {name: DB_PORT, value: "5432"}
            - name: DB_NAME
              valueFrom: {configMapKeyRef: {name: cms-config, key: POSTGRES_DB}}
            - {name: DB_USER, value: cms_app}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: cms-secrets, key: APP_DB_PASSWORD}}
            - {name: AUTH_TYPE, value: scram-sha-256}
            - {name: POOL_MODE, value: transaction}
            - {name: MAX_CLIENT_CONN, value: "2000"}
            - {name: DEFAULT_POOL_SIZE, value: "25"}
            - {name: MAX_PREPARED_STATEMENTS, value: "200"}
            - {name: LISTEN_PORT, value: "5432"}
          readinessProbe:
            tcpSocket: {port: pg}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: pg}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: etc, mountPath: /etc/pgbouncer}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: etc, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: cms-pgbouncer
spec:
  selector: {app.kubernetes.io/name: pgbouncer}
  ports: [{name: pg, port: 5432, targetPort: pg}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cms-pgbouncer
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: pgbouncer}
