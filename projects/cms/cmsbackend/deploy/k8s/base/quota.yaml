apiVersion: v1
kind: ResourceQuota
metadata:
  name: cms
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 12Gi
    limits.cpu: "24"
    limits.memory: 24Gi
    pods: "80"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cms
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {cpu: 500m, memory: 256Mi}
