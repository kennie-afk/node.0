apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-config
data:
  NODE_ENV: production
  # Production will not start on mock M-Pesa or SMS, and the default is mock, so this stays closed until
  # MPESA_MODE (daraja) and SMS_MODE (africastalking) are set here and their credentials are in the Secret.
  # A demo cluster can instead add ALLOW_MOCK_PROVIDERS_IN_PRODUCTION: "true" to run on mocks knowingly.
  PORT: "4400"
  METRICS_PORT: "9100"
  LOG_LEVEL: info
  DATABASE_SSL: "false"
  # Timeouts live on the database role (PgBouncer drops startup parameters).
  DB_STATEMENT_TIMEOUT_MS: "0"
  DB_POOL_MAX: "10"
  REDIS_URL: redis://cms-redis:6379
  CORS_ORIGINS: https://cms.example.org
  WORKER_CONCURRENCY: "4"
  SHUTDOWN_GRACE_MS: "20000"
  POSTGRES_DB: cms
  PGBOUNCER_HOST: cms-pgbouncer
