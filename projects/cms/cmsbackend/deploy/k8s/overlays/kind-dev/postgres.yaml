# Single-instance Postgres for kind/dev only. Production uses CloudNativePG (overlays/production).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cms-postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: church-cms}
spec:
  serviceName: cms-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: church-cms}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports: [{name: pg, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: cms}
            - {name: POSTGRES_DB, value: cms}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: cms-secrets, key: POSTGRES_PASSWORD}}
          args: ["-c", "max_connections=100", "-c", "shared_buffers=128MB"]
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U cms -d cms"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, "pg_isready -U cms -d cms"]}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: cms-postgres
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: pg, port: 5432, targetPort: pg}]
