# CloudNativePG (https://cloudnative-pg.io): operator-managed HA Postgres. 3 instances with
# synchronous replication, automated failover, continuous WAL archiving for point-in-time recovery.
# Install the operator once per cluster before applying this overlay.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cms-postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  primaryUpdateStrategy: unsupervised
  minSyncReplicas: 1
  maxSyncReplicas: 1
  bootstrap:
    initdb:
      database: cms
      owner: cms
      secret: {name: cms-owner}
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 1GB
      log_min_duration_statement: "500"
  storage:
    size: 100Gi
    storageClass: fast-ssd
  resources:
    requests: {cpu: "2", memory: 4Gi}
    limits: {memory: 6Gi}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: topology.kubernetes.io/zone
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://cms-pg-backups/prod
      endpointURL: https://s3.af-south-1.amazonaws.com
      s3Credentials:
        accessKeyId: {name: cms-backup-s3, key: ACCESS_KEY_ID}
        secretAccessKey: {name: cms-backup-s3, key: SECRET_ACCESS_KEY}
      wal: {compression: gzip}
      data: {compression: gzip}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cms-daily
spec:
  schedule: "0 0 1 * * *"
  backupOwnerReference: self
  cluster: {name: cms-postgres}
---
