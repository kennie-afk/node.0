# External Secrets Operator: secrets live in your manager (AWS Secrets Manager here), never in git.
# One remote entry `cms/prod` holds jwt_secret, owner_password and app_password; the connection
# strings are assembled here so a password rotation needs one change in one place.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cms-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws-secrets, kind: ClusterSecretStore}
  target:
    name: cms-secrets
    creationPolicy: Owner
    template:
      data:
        JWT_SECRET: "{{ .jwt }}"
        POSTGRES_PASSWORD: "{{ .owner }}"
        APP_DB_PASSWORD: "{{ .app }}"
        DATABASE_URL: "postgres://cms_app:{{ .app | urlquery }}@cms-pgbouncer:5432/cms"
        MIGRATE_DATABASE_URL: "postgres://cms:{{ .owner | urlquery }}@cms-postgres-rw:5432/cms"
  data:
    - {secretKey: jwt, remoteRef: {key: cms/prod, property: jwt_secret}}
    - {secretKey: owner, remoteRef: {key: cms/prod, property: owner_password}}
    - {secretKey: app, remoteRef: {key: cms/prod, property: app_password}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cms-owner
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws-secrets, kind: ClusterSecretStore}
  target:
    name: cms-owner
    template:
      type: kubernetes.io/basic-auth
      data: {username: cms, password: "{{ .password }}"}
  data:
    - {secretKey: password, remoteRef: {key: cms/prod, property: owner_password}}
