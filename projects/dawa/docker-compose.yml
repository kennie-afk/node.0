name: dawa

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dawa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-dawa}
    volumes:
      - dawa-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dawa}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["node", "dist/persistence/migrate.js"]
    environment: &db
      DATABASE_URL: postgres://dawa_app:${DAWA_APP_PASSWORD:?DAWA_APP_PASSWORD must be set and at least 12 characters}@postgres:5432/${POSTGRES_DB:-dawa}
      DATABASE_MIGRATION_URL: postgres://${POSTGRES_USER:-dawa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dawa}
      DAWA_APP_PASSWORD: ${DAWA_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set and at least 32 characters}
      MPESA_CALLBACK_SECRET: ${MPESA_CALLBACK_SECRET:?MPESA_CALLBACK_SECRET must be set and at least 16 characters}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment:
      <<: *db
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Dawa's own subscription: PROVISIONAL prices, see README "Billing"
      BILLING_MODE: ${BILLING_MODE:-mock}
      # this compose file is the local / demo path; a real deployment sets BILLING_MODE=live and removes this
      BILLING_ALLOW_MOCK_IN_PRODUCTION: ${BILLING_ALLOW_MOCK_IN_PRODUCTION:-true}
      BILLING_SHORTCODE: ${BILLING_SHORTCODE:-}
      BILLING_PRICE_FIRST_BRANCH_KES: ${BILLING_PRICE_FIRST_BRANCH_KES:-4500}
      BILLING_PRICE_EXTRA_BRANCH_KES: ${BILLING_PRICE_EXTRA_BRANCH_KES:-3500}
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS:-14}
      BILLING_SUSPEND_AFTER_DAYS: ${BILLING_SUSPEND_AFTER_DAYS:-14}
      SIGNUP_RESEND_COOLDOWN_SECONDS: ${SIGNUP_RESEND_COOLDOWN_SECONDS:-60}
      LOGIN_RATE_LIMIT_PER_WINDOW: ${LOGIN_RATE_LIMIT_PER_WINDOW:-5}
      API_PORT: 4200
    ports:
      - "${API_PORT:-4200}:4200"
    depends_on:
      migrate:
        condition: service_completed_successfully

  console:
    build: ./apps/console
    restart: unless-stopped
    environment:
      DAWA_API_URL: http://api:4200
    ports:
      - "${CONSOLE_PORT:-3700}:3700"
    depends_on:
      api:
        condition: service_healthy

volumes:
  dawa-data:
