name: forecourt

on:
  push:
    paths:
      - 'projects/carwash/**'
      - '.github/workflows/forecourt-ci.yml'
  pull_request:
    paths:
      - 'projects/carwash/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/carwash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/carwash/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
