name: church-cms

on:
  push:
    paths:
      - 'projects/cms/**'
      - '.github/workflows/church-cms-ci.yml'
  pull_request:
    paths:
      - 'projects/cms/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/cms/cmsbackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/cms/cmsbackend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
